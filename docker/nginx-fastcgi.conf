server {
    listen 80;
    # server_name _;
    # mydev.dv -> /etc/hosts -> add {127.0.0.1 mydev.dv}
    server_name mydev.dv;
    root /var/www/app;
    index index.php;

    error_log /var/log/nginx/error.log emerg;
    client_max_body_size 2048M;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # fastcgi_pass container_name:fpm_port  <- MUST FOLLOW THIS PATTERN
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.(png|jpg|webp)$ {
        error_page 404 /no-image-404.jpg;
    }
}
